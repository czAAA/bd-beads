<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__TITLE__ · design canvas</title>
    <link rel="stylesheet" href="/_app/styles/fonts.css" />
    <link rel="stylesheet" href="/_app/styles/tokens.css" />
    <link rel="stylesheet" href="/_app/styles/design-values.css" />
    <link rel="stylesheet" href="/_canvas/canvas.css" />
  </head>
  <body>
    <!-- The whole canvas is this list. data-sizes: desktop (1710×907), ipad (1366×1024), ipad-portrait, phone, or WxH.
         One <section> per option; data-states lists what option.js can show (the first is the one it opens in).
         Several questions: wrap each one's options in <section data-group="1" data-title="1 · Short name"
         data-question="…">; each group gets its own header and rule, and its options sit in one row per size. -->
    <main
      id="canvas"
      data-title="__TITLE__"
      data-question="The design question, in one line"
      data-sizes="desktop ipad"
      data-themes="light dark contrast"
      data-langs="en ru"
    >
__OPTIONS__
      <aside data-recommendation><p><b>Start with A · Name.</b> Why, in two or three lines.</p></aside>
    </main>
    <script src="/_canvas/canvas.js"></script>
  </body>
</html>
