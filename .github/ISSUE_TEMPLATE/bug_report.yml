name: Bug report
description: Something in the app doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: e.g. Safari 19 on iPad, Chrome 140 on Windows 11
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or files
      description: Drag in a screenshot, or a small pattern file that shows the problem.
