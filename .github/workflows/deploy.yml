name: Deploy

# Deploys the app and the backend Worker to Cloudflare (ticket 71, spec 385, docs/deploy.md). A push to main builds once
# and deploys dev (`bd-beads-dev`). When the pushed commit is a Production release (ticket 1044, spec 1043, ADR 0096),
# production (`bd-beads`) is then deployed from the same build, once dev's smoke check has passed. A manual run
# redeploys production from the newest release commit, never from main's head (until a first release exists, it
# deploys main's head). Which commit is a release is `scripts/release.ts`'s answer alone. Each deploy is
# `deploy-worker.yml`: each database's migrations, then the code, then a smoke check that /api/health answers with the
# commit it deployed. Once production's deploy of a release commit has passed its smoke check, the GitHub Release job
# tags that commit `vX.Y.Z` and makes its GitHub Release (ticket 1134).
#
# The Cloudflare token and account id live only in the `production` GitHub environment, which is limited to main, so
# no branch, pull request or fork can deploy. Only the steps that run Wrangler get the token, and the job that holds it
# installs with `--ignore-scripts` (deploy-worker.yml, ticket 394).

on:
  push:
    branches: [main]
    # A merge that only edits Markdown changes nothing that is served. A release always changes the release record
    # (src/data/releases.json), so it never skips.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      release: ${{ steps.commit.outputs.release }}
    steps:
      - name: Refuse any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploys run only from main, not $GITHUB_REF"
          exit 1
      # The whole history: the release script walks it, and so does the Version the build gives the app (spec 1043).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # A push builds the pushed commit. A manual run builds the commit production may get, and checks it out.
      - name: Choose the commit to build
        id: commit
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            commit=$GITHUB_SHA
          else
            commit=$(node scripts/release.ts production "$GITHUB_SHA")
            git checkout --quiet --detach "$commit"
          fi
          release=$(node scripts/release.ts is-release "$commit")
          echo "Building $commit (adds a release: $release)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - run: npm ci
      # The Worker serves the app at its root.
      - run: npm run build
        env:
          DEPLOY_BASE: /
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  dev:
    name: Deploy (dev)
    needs: build
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy-worker.yml
    with:
      worker: dev
      commit: ${{ needs.build.outputs.commit }}
    secrets: inherit

  # On a push, only after dev's deploy of the same build passed its smoke check; on a manual run, straight from the build.
  production:
    name: Deploy (production)
    needs: [build, dev]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || (needs.build.outputs.release == 'true' && needs.dev.result == 'success'))
    uses: ./.github/workflows/deploy-worker.yml
    with:
      worker: production
      commit: ${{ needs.build.outputs.commit }}
    secrets: inherit

  # Once production runs a release commit and its smoke check passed: the tag `vX.Y.Z` on that commit and the GitHub
  # Release `openbeads X.Y.Z`, marked Latest, whose notes are that release's section of CHANGELOG.md, from the same
  # generator (ticket 1134). Its own job, outside the production environment, with no secret but the run's own token: the
  # only job that may write to the repo. Running it again changes nothing; a tag of that name on another commit fails it,
  # and it never moves a tag.
  github-release:
    name: GitHub Release
    needs: [build, production]
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.build.outputs.release == 'true' &&
      needs.production.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The commit production runs, with its tags so an existing one is found: its record and notes give the Release.
      # The generator comes from the run's own commit on main, which a manual run's older release may predate.
      # No credential is left in either checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          path: release
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
      # Plain Node runs the generator: no install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tag the release and make its GitHub Release
        working-directory: release
        env:
          COMMIT: ${{ needs.build.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          version=$(node ../tools/scripts/changelog.ts --newest-release "$notes")
          # The generator refuses it too; checked again here, where it becomes a tag and a title.
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The newest release's Version is not plain X.Y.Z"
            exit 1
          fi
          tag="v$version"
          tagged=$(git rev-parse --quiet --verify "refs/tags/$tag^{commit}" || true)
          if [ -n "$tagged" ] && [ "$tagged" != "$COMMIT" ]; then
            echo "::error::$tag is already on $tagged, not $COMMIT; a release tag is never moved"
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag and its GitHub Release already exist; nothing to do"
            exit 0
          fi
          # The tag already on this commit (a run that made it and then failed) is kept; else the Release makes it.
          make=(gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "openbeads $version" --notes-file "$notes" --latest)
          if [ -n "$tagged" ]; then "${make[@]}" --verify-tag; else "${make[@]}" --target "$COMMIT"; fi
          echo "Made $tag on $COMMIT and its GitHub Release"
