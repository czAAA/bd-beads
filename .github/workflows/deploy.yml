name: Deploy

# Deploys the app and the backend Worker to Cloudflare (ticket 71, spec 385, docs/deploy.md). A push to main builds once
# and deploys dev (`bd-beads-dev`). When the pushed commit is a Production release (ticket 1044, spec 1043, ADR 0096),
# production (`bd-beads`) is then deployed from the same build, once dev's smoke check has passed. A manual run
# redeploys production from the newest release commit, never from main's head (until a first release exists, it
# deploys main's head). Which commit is a release is `scripts/release.ts`'s answer alone. Each deploy is
# `deploy-worker.yml`: each database's migrations, then the code, then a smoke check that /api/health answers with the
# commit it deployed.
#
# The Cloudflare token and account id live only in the `production` GitHub environment, which is limited to main, so
# no branch, pull request or fork can deploy. Only the steps that run Wrangler get the token, and the job that holds it
# installs with `--ignore-scripts` (deploy-worker.yml, ticket 394).

on:
  push:
    branches: [main]
    # A merge that only edits Markdown changes nothing that is served. A release always changes the release record
    # (src/data/releases.json), so it never skips.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      release: ${{ steps.commit.outputs.release }}
    steps:
      - name: Refuse any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploys run only from main, not $GITHUB_REF"
          exit 1
      # The whole history: the release script walks it, and so does the Version the build gives the app (spec 1043).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # A push builds the pushed commit. A manual run builds the commit production may get, and checks it out.
      - name: Choose the commit to build
        id: commit
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            commit=$GITHUB_SHA
            release=$(node scripts/release.ts is-release "$commit")
          else
            commit=$(node scripts/release.ts production "$GITHUB_SHA")
            release=false
            git checkout --quiet --detach "$commit"
          fi
          echo "Building $commit (adds a release: $release)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - run: npm ci
      # The Worker serves the app at its root.
      - run: npm run build
        env:
          DEPLOY_BASE: /
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  dev:
    name: Deploy (dev)
    needs: build
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy-worker.yml
    with:
      worker: dev
      commit: ${{ needs.build.outputs.commit }}
      domain: https://dev.openbeads.com
    secrets: inherit

  # On a push, only after dev's deploy of the same build passed its smoke check; on a manual run, straight from the build.
  production:
    name: Deploy (production)
    needs: [build, dev]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || (needs.build.outputs.release == 'true' && needs.dev.result == 'success'))
    uses: ./.github/workflows/deploy-worker.yml
    with:
      worker: production
      commit: ${{ needs.build.outputs.commit }}
      domain: https://openbeads.com
    secrets: inherit
