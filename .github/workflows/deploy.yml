name: Deploy

# Deploys the app and the backend Worker to Cloudflare (ticket 71, spec 385, docs/deploy.md). A push to main deploys
# dev (`bd-beads-dev`); a manual run deploys production (`bd-beads`), and only from main. One build, then each
# database's migrations, then the code, then a smoke check that /api/health answers with this commit.
#
# The Cloudflare token and account id live only in the `production` GitHub environment, which is limited to main, so
# no branch, pull request or fork can deploy. Migrations only add (docs/deploy.md), so a deploy that fails after them
# leaves the running code working.

on:
  push:
    branches: [main]
    # A merge that only edits Markdown changes nothing that is served.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKER: ${{ github.event_name == 'push' && 'dev' || 'production' }}

# One deploy per Worker at a time, never cancelled halfway through its migrations.
concurrency:
  group: deploy-${{ github.event_name == 'push' && 'dev' || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Refuse any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploys run only from main, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Worker serves the app at its root.
      - run: npm run build
        env:
          DEPLOY_BASE: /
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  deploy:
    name: Deploy (${{ github.event_name == 'push' && 'dev' || 'production' }})
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # Wrangler, at the version package.json pins.
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Apply the core database's migrations
        run: npx wrangler d1 migrations apply CORE --env "$WORKER" --remote
      - name: Apply the blobs database's migrations
        run: npx wrangler d1 migrations apply BLOBS_DB --env "$WORKER" --remote
      - name: Deploy the Worker
        id: deploy
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          npx wrangler deploy --env "$WORKER" --var "VERSION:$GITHUB_SHA"
          # The Worker's address, from Wrangler's own record of the deploy.
          url=$(jq -r 'select(.type == "deploy") | .targets[0] // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          if [ -z "$url" ]; then echo "::error::Wrangler reported no address for the deploy"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # A new version can take a few seconds to reach every location, so the check retries for up to two minutes.
      - name: Smoke check /api/health
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in $(seq 1 24); do
            body=$(curl -s --max-time 10 "$URL/api/health" || true)
            if [ "$(jq -r '.ok' <<<"$body" 2>/dev/null)" = true ] && [ "$(jq -r '.version' <<<"$body")" = "$GITHUB_SHA" ]; then
              echo "$URL/api/health: $body"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$URL/api/health didn't answer ok with version $GITHUB_SHA; last answer: $body"
          exit 1
