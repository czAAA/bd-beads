name: CI

# Kept to the cheapest check that must hold for every code change: typecheck and lint, in one job. The unit and visual
# tests run on the developer's machine before a push (.githooks/pre-push, ADR 0029), so GitHub Actions minutes go to
# deployments. Branch protection requires one check, "Typecheck and lint".

on:
  pull_request:

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      # The job always runs, so the required check always reports; a workflow-level `paths-ignore` would leave it
      # pending forever on a PR that only touches tickets or docs. Only the steps below are skipped.
      - name: Look for code changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate -q '.[].filename')
          if echo "$files" | grep -qvE '^(\.scratch/|.*\.md$|LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only tickets and Markdown changed; nothing to check."
          fi
      - if: steps.changes.outputs.code == 'true'
        uses: actions/checkout@v4
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.changes.outputs.code == 'true'
        run: npm ci
      - if: steps.changes.outputs.code == 'true'
        run: npm run typecheck
      - if: steps.changes.outputs.code == 'true'
        run: npm run lint
