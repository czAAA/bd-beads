name: CI

# Jobs that run at the same time; the pipeline takes as long as the slowest. Branch protection requires three checks
# by name: "Typecheck and lint", "Unit tests passed" (the aggregate of the unit shards) and "Visual check passed" (the aggregate of the visual shards).
#
# `pull_request`, never `pull_request_target`: a pull request's own code runs here, so the token is read-only and no
# secrets are used (docs/testing.md, CI). A PR that only edits Markdown changes nothing checked here, so it is skipped. Tickets live in the private docs repo, not here.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run knip

  # The unit tests are split across runners with Vitest's own sharding. Every test file lands in exactly one shard.
  # A runner has 4 cores and 15 GB (each test job prints its own). Measured there for ticket 1143, whole job: one shard
  # 170 s at 2 workers and 153 s at 4; two shards 91 and 71 s at 2 workers, 84 and 71 s at 4. Two shards at 4 workers:
  # a third would save less than its own install. Changing the count is this list only; the --shard flag follows it.
  unit:
    name: Unit tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The runner's cores and memory
        run: echo "$(nproc) cores, $(awk '/MemTotal/ { print int($2 / 1048576) }' /proc/meminfo) GB"
      - run: npx vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          BD_TEST_WORKERS: '4'

  # The two Playwright jobs (this and `visual`) run in Microsoft's Playwright image, which has Chromium and its system
  # libraries built in: installing them with apt on the runner took 11 to 14 minutes on a slow run. The image tag must
  # equal the installed @playwright/test version (package-lock.json); bump both together, or Chromium is not found.
  # The component tests that need a real browser (ticket 552): text fit and Tooltips, one component at a time. The unit
  # shards have no Chromium and skip them, so this job runs them and `BD_BROWSER_TESTS=1` makes a missing one an error.
  # Measured for ticket 1143, whole job, slowest shard (What's inside's tours play at 4×, about 60 to 75 s each):
  # 2 shards 245 s at 2 workers, 174 s at 4; 3 shards 209 s at 2; 4 shards 164 and 173 s at 2, 148 s at 3, 146 s at 4.
  # Four shards at 3 workers: at 4 the heaviest tests ran twice as long and one passed its time limit.
  # Changing the count is this list only; the --shard flag follows it.
  browser:
    name: Browser component tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The runner's cores and memory
        run: echo "$(nproc) cores, $(awk '/MemTotal/ { print int($2 / 1048576) }' /proc/meminfo) GB"
      - run: npx vitest run --project browser --project browser-touch --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          BD_BROWSER_TESTS: '1'
          BD_TEST_WORKERS: '3'

  # The one check branch protection names for the unit tests, so the shard count can change without touching it.
  # `if: always()` matters: a skipped or failed shard must fail this job, not skip it (a skipped required check passes).
  unit-passed:
    name: Unit tests passed
    runs-on: ubuntu-latest
    needs: [unit, browser]
    if: always()
    steps:
      - run: test "${{ needs.unit.result }}" = success && test "${{ needs.browser.result }}" = success

  # Built once and served as it is by every visual shard (SKIP_BUILD, e2e/support/server.ts).
  # The whole history: the build walks main's commits for the Version it gives the app, and fails on a shallow
  # checkout (spec 1043). The branch keeps every Release note main has, by name and kind (scripts/notes-guard.ts).
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Keep every Release note main has
        run: node scripts/notes-guard.ts origin/main
      - run: npm ci
      # The build alone, without `npm run build`'s type check: "Typecheck and lint" is the required check for types, and
      # the visual shards wait for this job (ticket 1143). The deploy's build keeps the type check.
      - run: npx vite build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # The visual tests are split across runners with Playwright's own sharding (the tests are fullyParallel, so it splits
  # by test, not by file). Every test lands in exactly one part; the reference screenshots stay one folder.
  # The offline shell's checks are a part of their own (`VISUAL_PART`, playwright.config.ts): the longest spec by far,
  # they made the shard they fell in the slowest (208 s against 99 s). Every other spec is split over the shards.
  # Measured for ticket 1143, whole job, slowest shard, at 2 workers: 2 shards 209 s, 3 shards 141 and 155 s, 4 shards
  # 142 s; the offline part 104 and 118 s. More workers gave no steady gain: 3 shards took 141 s at 2 workers, 162 s
  # at 3 and 174 s at 4. Changing the shard count is this list only: each shard names its own share.
  visual:
    name: Visual check (${{ matrix.part }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    needs: build
    strategy:
      fail-fast: false
      matrix:
        part: [1/4, 2/4, 3/4, 4/4, offline]
    env:
      VISUAL_WORKERS: '2'
      SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The runner's cores and memory
        run: echo "$(nproc) cores, $(awk '/MemTotal/ { print int($2 / 1048576) }' /proc/meminfo) GB"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - if: matrix.part == 'offline'
        run: npx playwright test
        env:
          VISUAL_PART: offline
      - if: matrix.part != 'offline'
        run: npx playwright test --shard=${{ matrix.part }}
        env:
          VISUAL_PART: rest
      # Each part's blob report, kept on failure and success alike so the merged report is whole.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: visual-blob-${{ strategy.job-index }}
          path: blob-report
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visual-test-results-${{ strategy.job-index }}
          path: test-results

  # One HTML report from all the shards' blobs, so a failure is read in one place.
  visual-report:
    name: Visual report
    runs-on: ubuntu-latest
    needs: visual
    if: always() && needs.visual.result != 'skipped'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: visual-blob-*
          path: all-blob-reports
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-check-report
          path: playwright-report
          retention-days: 7

  # The one check branch protection names for the visual tests, so the shard count can change without touching it.
  # `if: always()` matters: a skipped or failed shard must fail this job, not skip it (a skipped required check passes).
  visual-passed:
    name: Visual check passed
    runs-on: ubuntu-latest
    needs: [build, visual]
    if: always()
    steps:
      - run: test "${{ needs.build.result }}" = success && test "${{ needs.visual.result }}" = success
