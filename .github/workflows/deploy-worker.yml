name: Deploy a Worker

# One Worker's deploy, called by deploy.yml after its build (docs/deploy.md): each database's migrations, then the code,
# then a smoke check that /api/health answers with the commit deployed. Production first refuses any commit that is not
# the newest release commit on main (ticket 1044, `scripts/release.ts`).
#
# The Cloudflare token and account id live only in the `production` GitHub environment. Only the steps that run
# Wrangler get the token, and this job installs with `--ignore-scripts`: an install script could otherwise write to
# $GITHUB_ENV (NODE_OPTIONS, say) and so run inside those steps (ticket 394). Wrangler finds esbuild's and workerd's
# binaries through their optional dependencies, so it needs no install script. Migrations only add (docs/deploy.md), so
# a deploy that fails after them leaves the running code working.

on:
  workflow_call:
    inputs:
      worker:
        description: The Wrangler environment, `dev` or `production`.
        type: string
        required: true
      commit:
        description: The commit the build was made from, which this deploys and the smoke check expects.
        type: string
        required: true
      domain:
        description: The Worker's custom domain, for the advisory smoke check.
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate, deploy and check
    runs-on: ubuntu-latest
    environment: production
    # One deploy per Worker at a time, never cancelled halfway through its migrations. Dev and production each queue
    # on their own.
    concurrency:
      group: deploy-${{ inputs.worker }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: ${{ inputs.worker }}
      COMMIT: ${{ inputs.commit }}
    steps:
      # The commit that was built, not the one the run started from: the Worker's code and its migrations come from here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Against main as it is now, so a run that waited behind a newer release can't put the older one back.
      - name: Refuse any commit but the newest release
        if: inputs.worker == 'production'
        run: |
          git fetch --quiet origin main
          allowed=$(node scripts/release.ts production origin/main)
          if [ "$allowed" != "$COMMIT" ]; then
            echo "::error::Production takes only the newest release commit on main, $allowed, not $COMMIT"
            exit 1
          fi
      # Wrangler, at the version package.json pins; no install script runs in the job that holds the token.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Apply the core database's migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply CORE --env "$WORKER" --remote
      - name: Apply the blobs database's migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply BLOBS_DB --env "$WORKER" --remote
      - name: Deploy the Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          npx wrangler deploy --env "$WORKER" --var "VERSION:$COMMIT"
          # The Worker's address, from Wrangler's own record of the deploy.
          url=$(jq -r 'select(.type == "deploy") | .targets[0] // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          if [ -z "$url" ]; then echo "::error::Wrangler reported no address for the deploy"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # A new version can take a few seconds to reach every location, so the check retries for up to two minutes. Neither
      # Worker answers outside Access before the release, health included (ticket 395): the check signs in with the
      # Access service token, whose two secrets only the smoke checks get.
      - name: Smoke check /api/health
        env:
          URL: ${{ steps.deploy.outputs.url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$CF_ACCESS_CLIENT_ID" ]; then
            echo "::error::No CF_ACCESS_CLIENT_ID in the production environment: health answers only through Access (ticket 395)"
            exit 1
          fi
          headers=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          for attempt in $(seq 1 24); do
            body=$(curl -s --max-time 10 "${headers[@]}" "$URL/api/health" || true)
            if [ "$(jq -r '.ok' <<<"$body" 2>/dev/null)" = true ] && [ "$(jq -r '.version' <<<"$body")" = "$COMMIT" ]; then
              echo "$URL/api/health: $body"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$URL/api/health didn't answer ok with version $COMMIT; last answer: $body"
          exit 1
      # Ticket 400: the same check on the custom domain, advisory only. The zone's Bot Fight Mode answers a runner with
      # a "Just a moment..." challenge, which a Free zone can't exempt a path from, so a failure here warns and never
      # fails a deploy that the check above already proved. Dev is asked with the service token, as above (ticket 395).
      - name: Smoke check /api/health on the custom domain (advisory)
        env:
          URL: ${{ inputs.domain }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          headers=()
          if [ -n "$CF_ACCESS_CLIENT_ID" ]; then
            headers=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          for attempt in $(seq 1 6); do
            body=$(curl -s --max-time 10 "${headers[@]}" "$URL/api/health" || true)
            if [ "$(jq -r '.ok' <<<"$body" 2>/dev/null)" = true ] && [ "$(jq -r '.version' <<<"$body")" = "$COMMIT" ]; then
              echo "$URL/api/health: $body"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::$URL/api/health didn't answer ok with version $COMMIT (a bot challenge page is expected until ticket 391 decides); last answer: ${body:0:200}"
