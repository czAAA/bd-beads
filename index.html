<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The X1 mark, following the browser's light or dark setting; .ico and PNG for older browsers (DESIGN.md §3, favicon/). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The browser's bar around the installed app: the page background (`surface`) of the light or dark setting (tokens.json);
         the script below and src/theme/theme.ts set both to the chosen theme's (ticket 0998). -->
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The build writes the title, the description, the canonical link and the page's data from the dictionary, and
         the Homepage's copy into #app for crawlers, which the app replaces as it starts (vite.crawler.ts, ticket 1055). -->
    <title>Homepage · openbeads</title>
    <!-- The first screen's fonts, asked for with the page rather than once its code has drawn the text (ticket 0991), so
         the Welcome is set in them from its first paint and its heading keeps its two lines. -->
    <link rel="preload" href="/fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Before first paint: the theme and the language, exactly as the editor's index.html does, so neither flashes. -->
    <script>
      (function () {
        var root = document.documentElement
        var pick = null
        var locale = null
        try {
          // Ticket 392: the old bd-beads: key until the app has copied it forward.
          pick = localStorage.getItem('openbeads:theme') || localStorage.getItem('bd-beads:theme')
          locale = localStorage.getItem('openbeads:locale') || localStorage.getItem('bd-beads:locale')
        } catch (e) {}
        var theme =
          pick === 'light' || pick === 'dark' || pick === 'contrast'
            ? pick
            : matchMedia('(prefers-contrast: more)').matches
              ? 'contrast'
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
        root.dataset.theme = theme
        root.style.colorScheme = theme === 'dark' ? 'dark' : 'light'
        // The browser's bar on this theme's `surface` (tokens.json, ticket 0998), so a picked theme beats the metas'
        // device-keyed media; theme.ts keeps it after. The values are held in step by src/theme/theme.dom.test.ts.
        var surface = { light: '#fafafa', dark: '#1a1a1a', contrast: '#f0f0f0' }[theme]
        var bars = document.querySelectorAll('meta[name="theme-color"]')
        for (var b = 0; b < bars.length; b++) bars[b].content = surface
        root.lang = locale === 'ru' ? 'ru' : 'en'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/homepage/homepage.ts"></script>
  </body>
</html>
