<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The X1 mark, following the browser's light or dark setting; .ico and PNG for older browsers (DESIGN.md §3, favicon/). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The browser's bar around the installed app: the page background (`surface`) of the light or dark setting (tokens.json). -->
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <!-- viewport-fit=cover (ticket 166; responsive.md "Screen edges and height") lets env(safe-area-inset-*) read real insets. -->
    <!-- maximum-scale=1, user-scalable=no lock Page zoom (ticket 316, ADR 0034); iOS Safari ignores them, usePageZoomLock covers it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>openbeads</title>
    <!-- Before first paint: the theme (src/theme/theme.ts has the same rules) and the language, so neither flashes. -->
    <script>
      (function () {
        var root = document.documentElement
        var pick = null
        var locale = null
        try {
          // Ticket 392: the old bd-beads: key until the app has copied it forward.
          pick = localStorage.getItem('openbeads:theme') || localStorage.getItem('bd-beads:theme')
          locale = localStorage.getItem('openbeads:locale') || localStorage.getItem('bd-beads:locale')
        } catch (e) {}
        var theme =
          pick === 'light' || pick === 'dark' || pick === 'contrast'
            ? pick
            : matchMedia('(prefers-contrast: more)').matches
              ? 'contrast'
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
        root.dataset.theme = theme
        root.style.colorScheme = theme === 'dark' ? 'dark' : 'light'
        root.lang = locale === 'ru' ? 'ru' : 'en'
      })()
    </script>
    <!--
      The splash (ticket 69; Loading card): three beads in `accent` on the page background (`surface`) of the theme the
      script above picked, for a visit that has to wait for the code. Inline, so it needs no request; shown only after
      `loading-delay` (300ms) so a quick load never flashes; main.ts removes it when the app mounts. The values are
      tokens.json's (light | dark | contrast), held in step by src/styles/splash.test.ts, which also checks the bead
      size and gap against the Loading card's `--swatch-dot` and `--space-8`.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background: #fafafa;
        opacity: 0;
        animation: splash-show 1ms linear 300ms forwards;
      }
      [data-theme='dark'] #splash { background: #1a1a1a; }
      [data-theme='contrast'] #splash { background: #f0f0f0; }
      #splash i {
        width: 0.875rem;
        height: 0.875rem;
        border-radius: 9999px;
        background: #fa520f;
        animation: splash-swell 1.2s infinite ease-in-out;
      }
      [data-theme='dark'] #splash i { background: #faff69; }
      [data-theme='contrast'] #splash i { background: #a82c00; }
      #splash i:nth-child(2) { animation-delay: 0.15s; }
      #splash i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-show { to { opacity: 1; } }
      @keyframes splash-swell {
        0%, 80%, 100% { opacity: 0.45; transform: scale(0.55); }
        40% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash i { opacity: 0.8; animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><i></i><i></i><i></i></div>
    <!--
      Arriving from the Homepage (tickets 0776, 0783; ADR 0088): its canvas box was left where src/homepage/boxHandoff.ts
      remembered, with its Canvas strip's markup and its canvas marks. The first paint draws that box here (#handoff),
      the strip as the Homepage drew it a moment ago in this tab (its styles are in the stylesheet above), so the
      browser's step across the page load lands on the same picture; boxHandoff.ts grows it into the editor's once the
      app mounts. Read once, so a reload or any other way in is a plain one.
    -->
    <div id="handoff" aria-hidden="true" inert><div><i></i></div></div>
    <script data-handoff>
      (function () {
        var stored = null
        try {
          stored = sessionStorage.getItem('openbeads:homepage-box')
          sessionStorage.removeItem('openbeads:homepage-box')
        } catch (e) {}
        var box = null
        try {
          box = JSON.parse(stored)
        } catch (e) {}
        var sides = ['x', 'y', 'width', 'height', 'bodyY', 'bodyHeight']
        var look = ['marks', 'tile', 'bg']
        var placeholder = document.getElementById('handoff')
        if (!box || !placeholder || !('startViewTransition' in document) || matchMedia('(prefers-reduced-motion: reduce)').matches) return
        for (var i = 0; i < sides.length; i++) if (typeof box[sides[i]] !== 'number') return
        for (var k = 0; k < look.length; k++) if (typeof box[look[k]] !== 'string') return
        if (typeof box.strip !== 'string') return
        var root = document.documentElement
        for (var j = 0; j < sides.length; j++) root.style.setProperty('--handoff-' + sides[j], box[sides[j]] + 'px')
        for (var l = 0; l < look.length; l++) root.style.setProperty('--handoff-' + look[l], box[look[l]])
        placeholder.firstElementChild.insertAdjacentHTML('afterbegin', box.strip)
        root.dataset.handoff = 'arriving'
        var optIn = document.createElement('style')
        optIn.dataset.handoff = ''
        optIn.textContent = '@view-transition { navigation: auto; }'
        document.head.appendChild(optIn)
        addEventListener('pagereveal', function (event) {
          window.openbeadsHandoff = event.viewTransition
        })
        // An app that never mounts mustn't stay hidden under the box: the splash comes back.
        setTimeout(function () {
          if (root.dataset.handoff === 'arriving') delete root.dataset.handoff
        }, 4000)
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
