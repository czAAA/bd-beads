<!-- @dsCard group="Onboarding" height=1250 width=960 -->
<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8"><title>TourStep preview</title><style>.t2{width:328px;box-sizing:border-box;background:var(--overlay-fill,var(--canvas));border:1px solid var(--overlay-line,var(--panel-line));border-radius:12px;box-shadow:var(--elevation-3);padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;color:var(--ink);font:400 14px/20px var(--font-sans);text-align:left}
[data-theme="dark"] .t2{background:var(--panel);border-color:var(--line-strong)}
[data-theme="contrast"] .t2{border:2px solid var(--line-strong)}
.t2-top{display:flex;align-items:center;gap:8px}
.t2-ti{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(242,201,76,.28);color:var(--ink);flex:none;box-shadow:inset 0 0 0 1px rgba(200,150,20,.35)}
[data-theme="contrast"] .t2-ti{background:none;box-shadow:inset 0 0 0 2px var(--ink)}
.t2-tn{font:500 14px/20px var(--font-sans)}
.t2 kbd{display:inline-flex;align-items:center;height:22px;min-width:22px;justify-content:center;padding:0 6px;box-sizing:border-box;font:400 12px/1 var(--font-mono);color:var(--ink);background:var(--elevated);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px}
.t2-n{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font:400 12px/16px var(--font-mono);color:var(--muted);text-transform:lowercase}
.t2-strand{display:flex;gap:2px}
.t2-strand i{width:5px;height:5px;border-radius:1.2px;background:var(--bead-empty)}
.t2-strand i.d{background:var(--ink)}
.t2-strand i.c{background:#f2c94c;box-shadow:0 0 0 1px rgba(160,120,10,.6)}
.t2 h3{margin:4px 0 0;font:600 16px/24px var(--font-sans)}
.t2 p{margin:0;color:var(--body)}
.t2-x{align-self:flex-start;min-height:34px;padding:7px 12px;box-sizing:border-box;border-radius:8px;border:1px solid var(--line-strong);background:var(--elevated);font:500 14px/20px var(--font-sans);color:var(--ink)}
.t2-ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.t2-skip{border:0;background:none;padding:0;font:500 14px/20px var(--font-sans);color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)}
.t2-next{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--elevated);font:500 14px/20px var(--font-sans);color:var(--ink)}
.t2-pri{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);font:500 14px/20px var(--font-sans);color:var(--on-accent)}
.t2.ph .t2-next,.t2.ph .t2-pri{height:44px}
.tl{position:absolute;inset:0;pointer-events:none;z-index:40}
.tl>svg{position:absolute;inset:0;overflow:visible}
.tl .t2{position:absolute}
.tl-dim{fill:rgba(0,0,0,.26)}
[data-theme="dark"] .tl-dim{fill:rgba(0,0,0,.55)}
.tl-glow{fill:none;stroke:rgba(242,201,76,.38);stroke-width:8}
.tl-gold{fill:none;stroke:#f2c94c;stroke-width:2.5}
[data-theme="contrast"] .tl-glow{stroke:none}[data-theme="contrast"] .tl-gold{stroke:var(--ink);stroke-width:3}
.tl-conn{fill:none;stroke:var(--muted);stroke-width:1.25;stroke-linecap:round;stroke-dasharray:.01 4.5}
.tl-end{fill:var(--muted)}
.ts-bd{aspect-ratio:10/75 !important;width:auto !important;height:100% !important;max-width:none !important;max-height:none !important;background:var(--board) !important;border-radius:18px !important;padding:10px;box-sizing:border-box;display:grid;place-items:center}
.ts-bd img{height:100%;width:auto;display:block}
.scr-host{position:relative;overflow:hidden}
.k-ic{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/20px var(--font-sans)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.g-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;background:var(--canvas);border-bottom:1px solid var(--line-soft)}
.g-ttl{display:flex;align-items:center;gap:8px}
.g-ttl b{font:700 16px/1 var(--font-sans)}
.g-ttl i{font:italic 400 18px/1 var(--font-serif);color:var(--muted)}
.g-nav{display:flex;align-items:center;gap:8px}
.g-st{font:400 13px/18px var(--font-mono);color:var(--muted);min-width:44px;text-align:center}
.g-b{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--button-line);background:var(--button);color:var(--ink);font:500 13px/18px var(--font-sans);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.g-b.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.g-b:disabled{opacity:.45;cursor:default}
.g-opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.k-seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--button-line);background:var(--button);border-radius:8px}
.k-seg button{height:28px;padding:0 9px;border:0;border-radius:6px;background:none;font:500 12.5px/18px var(--font-sans);color:var(--muted);cursor:pointer;white-space:nowrap}
.k-seg button[aria-checked="true"]{background:var(--ink);color:var(--canvas)}
:where(button):focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.g-wrap{display:grid;grid-template-columns:1fr;gap:14px;padding:12px}
@media (min-width:1100px){.g-wrap{grid-template-columns:1fr 260px}}
.g-stage{display:flex;justify-content:center;align-items:flex-start;min-width:0;overflow-x:auto}
.g-dev{position:relative;overflow:hidden;border-radius:14px;box-shadow:0 0 0 4px var(--line-strong)}
.g-in{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--canvas)}
.g-side{display:flex;flex-direction:column;gap:6px}
.g-cap{font:italic 400 16px/20px var(--font-serif);color:var(--muted);min-height:0}
.g-list{display:flex;flex-direction:column;gap:2px}
.g-li{display:flex;gap:10px;align-items:center;text-align:left;padding:7px 10px;border:0;border-radius:10px;background:none;cursor:pointer;color:var(--ink)}
.g-li:hover{background:var(--hover-fill)}
.g-li.on{background:var(--panel)}
.g-li b{display:block;font:500 13px/18px var(--font-sans)}
.g-li em{display:block;font-style:normal;font:400 12px/16px var(--font-mono);color:var(--muted)}
.g-li kbd{font:400 11px/1 var(--font-mono);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:3px;padding:1px 4px;background:var(--elevated)}
.g-li .t2-ti{width:26px;height:26px;border-radius:7px}
.t2-off{display:flex;gap:8px;margin:0;font:400 13px/18px var(--font-sans);color:var(--muted)}
.g-img{position:relative;display:block;height:100%;padding:18px 0 0 22px;box-sizing:border-box}
.g-img img{height:100%;width:auto;display:block}
.ts-bd{padding:10px 10px 10px 6px !important}
.g-rt{position:absolute;left:22px;right:0;top:2px;height:12px}
.g-rl{position:absolute;left:0;width:18px;top:18px;bottom:0}
.g-rt span,.g-rl span{position:absolute;font:400 10px/1 var(--font-mono);color:var(--ruler)}
.g-rt span{transform:translateX(-50%)}
.g-rl span{right:0;transform:translateY(-50%)}
.g-rl span.on{color:var(--marker);font-weight:700}
.g-mk{fill:rgba(242,201,76,.28);stroke:#e0a800;stroke-width:1.4;stroke-dasharray:2.5 2}
.g-sel{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:0 4}
.g-paste{fill:rgba(242,201,76,.16);stroke:#e0a800;stroke-width:1.6;stroke-dasharray:4 3}
[data-theme="contrast"] .g-mk,[data-theme="contrast"] .g-paste{stroke:var(--ink)}
.g-toast{position:absolute;width:420px}
.m-bd>.ts-bd{height:calc(100% - 66px) !important;align-self:start;margin-top:6px}
.p-bd>.ts-bd{height:calc(100% - 12px) !important;align-self:start}

.g-bar{position:relative;top:0}
</style>
</head>

      var tools = { 2: 'Fill', 3: 'Paint', 4: 'Fill', 5: 'Paint', 6: 'Select', 8: 'Erase', 9: 'Remove line' };
      if (tools[n]) return { scr: 'phoneTools', text: tools[n], last: true, side: 'dock-top' };
      if (n === 7) return { scr: 'phone', board: true, side: 'dock-top' };
      if (n === N) return { scr: 'phone', sel: '.m-sw1', side: 'dock-top' };
      return { scr: 'phone', text: { 1: 'Pattern', 10: 'Size' }[n] || 'Pattern', last: true, side: 'dock-top' };
    }
    if (t === 'mini') {
      var tb = { 2: 'Fill', 3: 'Paint', 4: 'Fill', 5: 'Paint', 6: 'Select', 8: 'Erase' };
      if (tb[n]) return { scr: 'mini', sel: '.m-tbar b', text: tb[n], side: 'above' };
      if (n === 1) return { scr: 'mini', sel: '[data-np]', side: 'below' };
      if (n === 7) return { scr: 'mini', board: true, side: 'right' };
      if (n === N) return { scr: 'mini', sel: '.m-sw1', side: 'above' };
      return { scr: 'mini', off: true, side: 'center', drawer: true };
    }
    var tab = { 2: 'Fill', 3: 'Paint', 4: 'Fill', 5: 'Paint', 6: 'Select', 8: 'Erase' };
    if (tab[n]) return { scr: t, sel: '.m-tabs b', text: tab[n], side: 'right', col: true };
    return { 1: { scr: t, sel: 'button', text: 'New Pattern', side: 'below' }, 7: { scr: t, board: true, side: 'right' }, 9: { scr: t, sel: '.m-rl', side: 'right', col: true },
      10: { scr: t, sel: '.m-dr', text: 'Size', starts: true, side: 'right', col: true },
      11: { scr: t, sel: '.m-sw1', side: 'above' }, 12: { scr: t, sel: 'button', text: 'Export', side: 'right', col: true } }[n];
  }
  var BEFORE = { 1: 'empty', 2: 'empty', 3: 'after2', 4: 'after3', 5: 'after4', 6: 'after5', 7: 'after6', 8: 'after7', 9: 'final', 10: 'final', 11: 'final', 12: 'final' };
  function find(root, o) {
    var els = root.querySelectorAll(o.sel || '*'), hit = null;
    for (var i = 0; i < els.length; i++) {
      var tx = els[i].textContent.trim();
      if (!o.text || tx === o.text || (o.starts && tx.indexOf(o.text) === 0)) { if (!o.last) return els[i]; hit = els[i]; }
    }
    if (o.last && o.text && hit) { var p = hit; while (p.parentElement && p.parentElement.textContent.trim() === o.text) p = p.parentElement; return p; }
    return hit;
  }
  function strand(n) { var s = '<span class="t2-strand" aria-hidden="true">'; for (var i = 1; i <= N; i++) s += '<i class="' + (n === F || i < n ? 'd' : i === n ? 'c' : '') + '"></i>'; return s + '</span>'; }
  function card(n, o) {
    var fin = n === F, Sx = fin ? FINAL3 : STEPS3[n - 1], key = Sx.tool[3] && !o.ph ? '<kbd>' + Sx.tool[3] + '</kbd>' : '';
    var h = '<div class="t2' + (o.ph ? ' ph' : '') + '" role="dialog" aria-label="' + (L ? 'Обучение, шаг ' : 'Tour, step ') + Math.min(n, N) + (L ? ' из ' + N + ': ' : ' of ' + N + ': ') + Sx.t[L] + '"' + (o.w ? ' style="width:' + o.w + 'px"' : '') + '>' +
      '<div class="t2-top"><span class="t2-ti">' + ic(Sx.tool[0], 17) + '</span><span class="t2-tn">' + Sx.tool[1 + L] + '</span>' + key + '<span class="t2-n">' + Math.min(n, N) + ' ' + TX3.of[L] + ' ' + N + strand(n) + '</span></div>' +
      '<h3>' + Sx.t[L] + '</h3><p>' + Sx.b[L] + '</p>';
    if (o.off) h += '<p class="t2-off">' + ic('info', 16) + '<span>' + TX3M.off[L] + '</span></p>';
    if (Sx.x) h += '<button class="t2-x">' + Sx.x[L] + '</button>';
    h += fin ? '<div class="t2-ft"><button class="t2-skip">' + FINAL3.keep[L] + '</button><button class="t2-pri">' + FINAL3.go[L] + '</button></div>'
      : '<div class="t2-ft"><button class="t2-skip" data-skip>' + TX3.skip[L] + '</button><button class="t2-next" data-next>' + TX3.next[L] + '</button></div>';
    return h + '</div>';
  }
  function rr(r, k) { var x = r.x, y = r.y, w = r.w, h = r.h; return 'M' + (x + k) + ' ' + y + 'H' + (x + w - k) + 'A' + k + ' ' + k + ' 0 0 1 ' + (x + w) + ' ' + (y + k) + 'V' + (y + h - k) + 'A' + k + ' ' + k + ' 0 0 1 ' + (x + w - k) + ' ' + (y + h) + 'H' + (x + k) + 'A' + k + ' ' + k + ' 0 0 1 ' + x + ' ' + (y + h - k) + 'V' + (y + k) + 'A' + k + ' ' + k + ' 0 0 1 ' + (x + k) + ' ' + y + 'Z'; }
  function rect(el, base, s) { var a = base.getBoundingClientRect(), b = el.getBoundingClientRect(); return { x: (b.left - a.left) / s, y: (b.top - a.top) / s, w: b.width / s, h: b.height / s }; }
  function board(shell, state) {
    var emp = getComputedStyle(document.documentElement).getPropertyValue('--bead-empty').trim() || '#d8d2cc';
    [].forEach.call(shell.querySelectorAll('.ts-bd'), function (b) {
      var t = '', l = '';
      [1, 5, 10].forEach(function (c) { t += '<span style="left:' + ((c - .5) / 10 * 100) + '%">' + c + '</span>'; });
      [1, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 75].forEach(function (r) { l += '<span style="top:' + ((r - .5) / 75 * 100) + '%"' + (r === 1 ? ' class="on"' : '') + '>' + r + '</span>'; });
      b.innerHTML = '<span class="g-img"><span class="g-rt">' + t + '</span><span class="g-rl">' + l + '</span><img alt="" src="' + K.patternURL(ST[state], { px: 10, gap: 2, key: 'g' + state + emp, empty: emp }) + '"></span>';
    });
  }
  function marks(n, img, base, s) {
    var m = MARKS[n]; if (!m) return '';
    var r = rect(img, base, s), u = r.h / 75, cw = r.w / 10, out = '';
    function bead(row, col, cls) { out += '<rect class="' + cls + '" x="' + (r.x + (col - 1) * cw + 1) + '" y="' + (r.y + (row - 1) * u + 1) + '" width="' + (cw - 2) + '" height="' + (u - 2) + '" rx="2"/>'; }
    function box(row, col, h, w, cls) { out += '<rect class="' + cls + '" x="' + (r.x + (col - 1) * cw - 2) + '" y="' + (r.y + (row - 1) * u - 2) + '" width="' + (w * cw + 4) + '" height="' + (h * u + 4) + '" rx="4"/>'; }
    if (n === 6) { box(m.select[0], m.select[1], m.select[2], m.select[3], 'g-sel'); m.pasteAt.forEach(function (p) { box(p[0], p[1], 11, 10, 'g-paste'); }); }
    else m.forEach(function (c) { bead(c[0], c[1], 'g-mk'); });
    return out;
  }
  function draw() {
    L = S.lang === 'ru' ? 1 : 0;
    document.documentElement.setAttribute('data-theme', S.theme);
    document.documentElement.lang = S.lang;
    var t = tier(), sz = TIERS[t], sp = spec(t, S.n);
    bar(t);
    var stage = document.getElementById('stage');
    var aw = stage.clientWidth - 24, ah = Math.max(420, innerHeight - document.getElementById('bar').offsetHeight - 36);
    var s = Math.min(1, aw / sz[0], ah / sz[1]);
    stage.innerHTML = '<div class="g-dev" style="width:' + Math.round(sz[0] * s) + 'px;height:' + Math.round(sz[1] * s) + 'px"><div class="g-in" style="width:' + sz[0] + 'px;height:' + sz[1] + 'px;transform:scale(' + s + ')">' + SCREENS[sp.scr] + '</div></div>';
    var inn = stage.querySelector('.g-in');
    if (t === 'desk' || t === 'air') inn.firstChild.style.width = sz[0] + 'px';
    board(inn, BEFORE[S.n]);
    var el = sp.off ? null : sp.board ? inn.querySelector('.ts-bd') : find(inn, sp), tr = el ? rect(el, inn, s) : null;
    var layer = document.createElement('div'); layer.className = 'tl';
    var ph = t === 'phone';
    layer.innerHTML = card(S.n, { ph: ph, w: ph ? sz[0] - 24 : 0, off: sp.off });
    inn.appendChild(layer);
    var c = layer.querySelector('.t2'), cwid = c.offsetWidth, ch = c.offsetHeight, W = sz[0], H = sz[1], M = 12, GAP = 56;
    var cl = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
    var hole = tr ? { x: tr.x - 5, y: tr.y - 5, w: tr.w + 10, h: tr.h + 10 } : null, x, y, side = sp.side;
    if (!hole || side === 'center') { x = (W - cwid) / 2; y = (H - ch) / 2; }
    else if (side === 'right') { var minX = 0; if (sp.col) { var col = inn.querySelector('.m-col'); if (col) { var cr = rect(col, inn, s); minX = cr.x + cr.w + 40; } } x = Math.min(Math.max(hole.x + hole.w + GAP, minX), W - cwid - M); y = cl(hole.y + hole.h / 2 - ch / 2 - 20, 76, H - ch - M); }
    else if (side === 'above') { y = hole.y - GAP - ch; x = cl(hole.x + hole.w / 2 - cwid / 2 - 60, M, W - cwid - M); }
    else if (side === 'below') { y = hole.y + hole.h + GAP; x = cl(hole.x + hole.w / 2 - cwid / 2 - 40, M, W - cwid - M); }
    else if (side === 'dock-top') { x = M; y = 64; }
    c.style.left = x + 'px'; c.style.top = y + 'px';
    var bimg = inn.querySelector('.ts-bd img'), bh = null;
    if (MARKS[S.n] && bimg) { var bb = inn.querySelector('.ts-bd'); bh = rect(bb, inn, s); var cvb = inn.querySelector('.m-cv,.p-cv'); if (cvb) { var cv = rect(cvb, inn, s); var y2 = Math.min(bh.y + bh.h, cv.y + cv.h); bh.y = Math.max(bh.y, cv.y); bh.h = y2 - bh.y; } }
    var svg = '<svg width="' + W + '" height="' + H + '" aria-hidden="true"><path class="tl-dim" fill-rule="evenodd" d="M0 0H' + W + 'V' + H + 'H0Z' + (hole ? rr(hole, 9) : '') + (bh ? rr(bh, 16) : '') + '"/>';
    if (bimg && MARKS[S.n]) svg += marks(S.n, bimg, inn, s);
    if (hole) {
      svg += '<rect class="tl-glow" x="' + hole.x + '" y="' + hole.y + '" width="' + hole.w + '" height="' + hole.h + '" rx="9"/><rect class="tl-gold" x="' + hole.x + '" y="' + hole.y + '" width="' + hole.w + '" height="' + hole.h + '" rx="9"/>';
      var px, py, qx, qy, d;
      if (side === 'right') { px = x; py = cl(hole.y + hole.h / 2, y + 18, y + ch - 18); qx = hole.x + hole.w + 8; qy = hole.y + hole.h / 2; d = 'M' + px + ' ' + py + ' C ' + (px - 30) + ' ' + py + ', ' + (qx + 30) + ' ' + qy + ', ' + qx + ' ' + qy; }
      else if (side === 'below') { px = cl(hole.x + hole.w / 2, x + 18, x + cwid - 18); py = y; qx = hole.x + hole.w / 2; qy = hole.y + hole.h + 8; d = 'M' + px + ' ' + py + ' C ' + px + ' ' + (py - 26) + ', ' + qx + ' ' + (qy + 26) + ', ' + qx + ' ' + qy; }
      else { px = cl(hole.x + hole.w / 2, x + 18, x + cwid - 18); py = y + ch; qx = hole.x + hole.w / 2; qy = hole.y - 8; if (qy < py) { qy = hole.y + hole.h + 8; py = y; } d = 'M' + px + ' ' + py + ' C ' + px + ' ' + (py + (qy > py ? 26 : -26)) + ', ' + qx + ' ' + (qy + (qy > py ? -26 : 26)) + ', ' + qx + ' ' + qy; }
      svg += '<path class="tl-conn" d="' + d + '"/><circle class="tl-end" cx="' + qx + '" cy="' + qy + '" r="2.2"/>';
    }
    layer.insertAdjacentHTML('afterbegin', svg + '</svg>');
    if (S.toast && S.n !== F) {
      layer.querySelector('svg').style.display = 'none'; c.style.display = 'none';
      var box = inn.querySelector('.m-cv') || inn.querySelector('.p-cv') || inn;
      var br = rect(box, inn, s);
      layer.insertAdjacentHTML('beforeend', '<div class="bb-message g-toast" role="status" style="left:' + (br.x + br.w - 440) + 'px;top:' + (br.y + br.h - 130) + 'px">' + '<svg class="bb-icon" viewBox="0 0 24 24" aria-hidden="true">' + K.IC.info + '</svg><span class="bb-message-text">' + TX3.toast[L] + '</span></div>');
    }
    layer.addEventListener('click', function (e) {
      if (e.target.closest('[data-next]')) go(1);
      if (e.target.closest('[data-skip]')) { S.toast = true; save(); draw(); }
      if (e.target.closest('.t2-skip:not([data-skip])')) { S.n = 1; save(); draw(); }
    });
    var cap = document.getElementById('cap');
    cap.innerHTML = (sp.drawer ? TX3M.drawer[L] : '') ;
    list();
  }
  function go(d) { S.toast = false; S.n = Math.max(1, Math.min(F, S.n + d)); save(); draw(); }
  function seg(key, opts) { return '<span class="k-seg" role="radiogroup">' + opts.map(function (o) { return '<button type="button" role="radio" data-k="' + key + '" data-v="' + o[0] + '" aria-checked="' + (S[key] === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</span>'; }
  function bar(t) {
    var b = document.getElementById('bar');
    b.innerHTML = '<span class="g-ttl">' + K.mark(20, 3.6) + '<b>bd-beads</b><i>' + TX3M.title[L] + '</i></span>' +
      '<span class="g-nav"><button class="g-b" data-go="-1"' + (S.n === 1 ? ' disabled' : '') + '>' + ic('chevleft', 16) + TX3M.back[L] + '</button><span class="g-st">' + (S.n === F ? '✓' : S.n + ' / ' + N) + '</span><button class="g-b pri" data-go="1"' + (S.n === F ? ' disabled' : '') + '>' + TX3M.fwd[L] + ic('chevleft', 16, 'transform:scaleX(-1)') + '</button></span>' +
      '<span class="g-opts">' + seg('tier', ['auto', 'phone', 'mini', 'ipad13', 'air', 'desk'].map(function (k) { return [k, TNAME[k][L]]; })) +
      seg('theme', [['light', TX3M.light[L]], ['dark', TX3M.dark[L]], ['contrast', TX3M.hc[L]]]) + seg('lang', [['en', 'EN'], ['ru', 'RU']]) +
      '<button class="g-b" data-toast>' + TX3M.toastb[L] + '</button></span>';
  }
  function list() {
    var h = '';
    STEPS3.concat([FINAL3]).forEach(function (x, i) {
      var n = i + 1;
      h += '<button class="g-li' + (n === S.n ? ' on' : '') + '" data-n="' + n + '"><span class="t2-ti">' + ic(x.tool[0], 15) + '</span><span><b>' + (n === F ? '✓ ' : n + '. ') + x.t[L] + '</b><em>' + x.tool[1 + L] + (x.tool[3] ? ' · <kbd>' + x.tool[3] + '</kbd>' : '') + '</em></span></button>';
    });
    document.getElementById('list').innerHTML = h;
  }
  document.addEventListener('click', function (e) {
    var g = e.target.closest('#bar [data-go]'); if (g) go(+g.getAttribute('data-go'));
    var k = e.target.closest('#bar [data-k]'); if (k) { S[k.getAttribute('data-k')] = k.getAttribute('data-v'); save(); draw(); }
    if (e.target.closest('#bar [data-toast]')) { S.toast = !S.toast; save(); draw(); }
    var li = e.target.closest('.g-li'); if (li) { S.n = +li.getAttribute('data-n'); S.toast = false; save(); draw(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('input,textarea')) return;

  var rt; addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(draw, 120); });
  draw();

})();
