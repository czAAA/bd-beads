<!-- @dsCard group="Feedback" height=250 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Message preview</title></head>
<body>
<div class="bb-col" style="padding:16px">
<div class="bb-message" role="status"><svg class="bb-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5l5 5 10-10.5" /></svg><span class="bb-message-text">Pattern exported.</span><button class="bb-message-close" aria-label="Close"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></svg></button></div>
<div class="bb-message bb-message--warning" role="status"><svg class="bb-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.2 2.8 17.5a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z" /><path d="M12 10v4" /><path stroke-width="2.6" d="M12 17.2h.01" /></svg><span class="bb-message-text">This Pattern is large; framing may be slow.</span><button class="bb-message-close" aria-label="Close"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></svg></button></div>
<div class="bb-message bb-message--danger" role="alert"><svg class="bb-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.2 2.8 17.5a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z" /><path d="M12 10v4" /><path stroke-width="2.6" d="M12 17.2h.01" /></svg><span class="bb-message-text">Couldn't save. Your changes are kept on screen.</span><button class="bb-message-close" aria-label="Close"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></svg></button></div>
</div>
</body>
</html>
