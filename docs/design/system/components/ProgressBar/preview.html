<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ProgressBar preview</title></head>
<body>
<div class="bb-col" style="padding:8px">
<div class="bb-progress"><button class="bb-switch" role="switch" aria-checked="true" aria-label="Show row progress"></button><span class="bb-control bb-row-label">Row 12</span><span class="bb-meta">of 30 · top to bottom</span><span class="bb-track"><span style="width:37%"></span></span>
<button class="bb-btn bb-btn--icon" aria-label="Turn row direction"><svg class="bb-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M8 19.5v-15M4.5 8 8 4.5 11.5 8" /><path d="M16 4.5v15M12.5 16l3.5 3.5 3.5-3.5" /></svg></button><button class="bb-btn"><svg class="bb-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6" /></svg>Row not done</button><button class="bb-btn bb-btn--primary"><svg class="bb-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5l5 5 10-10.5" /></svg>Row done</button></div>
<div class="bb-progress"><button class="bb-switch" role="switch" aria-checked="false" aria-label="Show row progress"></button><span class="bb-label">row progress</span></div>
</div>
</body>
</html>
