<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ToolTabs preview</title></head>
<body>
<div class="bb-stage--panel" style="padding:24px;width:264px">
<span class="bb-label" style="display:block;margin-bottom:8px">tools</span>
<div class="bb-tools" role="tablist" aria-label="Tools"><button class="bb-tool" role="tab" aria-selected="true" aria-label="Paint" aria-keyshortcuts="1" title="Paint (1)"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l4 4L8.5 19.5l-5 1 1-5L15 5z"/><path d="M15 5l2-2a1.4 1.4 0 0 1 2 0l2 2a1.4 1.4 0 0 1 0 2l-2 2"/><path d="M4.5 15.5l4 4"/></svg></button><button class="bb-tool" role="tab" aria-selected="false" aria-label="Fill" aria-keyshortcuts="2" title="Fill (2)"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3.5 3.9 10.1a1.6 1.6 0 0 0 0 2.3l5.2 5.2a1.6 1.6 0 0 0 2.3 0L18 11z" /><path d="M4 11.2h14" /><path stroke-width="2.6" d="M20.2 16.5h.01" /></svg></button><button class="bb-tool" role="tab" aria-selected="false" aria-label="Select" aria-keyshortcuts="3" title="Select (3)"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path stroke-width="2.4" stroke-dasharray="0 4" d="M4 4h16v16H4z" /></svg></button><button class="bb-tool" role="tab" aria-selected="false" aria-label="Erase" aria-keyshortcuts="E" title="Erase (E)"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20 4 15a1.6 1.6 0 0 1 0-2.3L12.7 4a1.6 1.6 0 0 1 2.3 0l5 5a1.6 1.6 0 0 1 0 2.3L11.4 20z" /><path d="M8.3 8.4l7.3 7.3" /><path d="M14.5 20h5.5" /></svg></button><button class="bb-tool" role="tab" aria-selected="false" aria-label="Hand" aria-keyshortcuts="H" title="Hand (H)"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12.5V6a1.5 1.5 0 0 1 3 0v5M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6a1.5 1.5 0 0 1 3 0v8.5a6 6 0 0 1-6 6h-.5a6 6 0 0 1-4.6-2.2L4 15.5a1.5 1.5 0 0 1 2.3-1.9L8 15" /></svg></button><button class="bb-tool" role="tab" aria-selected="false" aria-label="Frame" aria-keyshortcuts="F" title="Frame (F)"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 3.5v17M16.5 3.5v17M3.5 7.5h17M3.5 16.5h17" /></svg></button></div>
<button class="bb-link bb-tool-remove"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>Remove Frame</button>
<div class="bb-tool-actions"><button class="bb-link" disabled><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5h16M4 19.5h16" /><path d="M12 7.5v3.5M9.5 8.75 12 11.25l2.5-2.5" /><path d="M12 16.5V13M9.5 15.25 12 12.75l2.5 2.5" /></svg>Remove line</button><button class="bb-link bb-link--danger"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5h15" /><path d="M9.5 6.5v-2a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2" /><path d="M6.5 6.5l.8 12.2a1.6 1.6 0 0 0 1.6 1.5h6.2a1.6 1.6 0 0 0 1.6-1.5l.8-12.2" /></svg>Clear</button></div>
</div>
</body>
</html>
