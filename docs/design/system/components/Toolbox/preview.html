<!-- @dsCard group="Toolbox" height=520 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toolbox preview</title></head>
<body>
<div style="padding:16px;background:var(--canvas)"><div class="bb-box bb-box--toolbox">
<div class="bb-group"><span class="bb-label">tools</span>
<div class="bb-tools" role="tablist" aria-label="Tools"><button class="bb-tool" role="tab" aria-selected="true" aria-label="Paint" aria-keyshortcuts="1" title="Paint (1)"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l4 4L8.5 19.5l-5 1 1-5L15 5z"/><path d="M15 5l2-2a1.4 1.4 0 0 1 2 0l2 2a1.4 1.4 0 0 1 0 2l-2 2"/><path d="M4.5 15.5l4 4"/></svg></button><button class="bb-tool" role="tab" aria-selected="false" aria-label="Fill" aria-keyshortcuts="2" title="Fill (2)"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3.5 3.9 10.1a1.6 1.6 0 0 0 0 2.3l5.2 5.2a1.6 1.6 0 0 0 2.3 0L18 11z" /><path d="M4 11.2h14" /><path stroke-width="2.6" d="M20.2 16.5h.01" /></svg></button><button class="bb-tool" role="tab" aria-selected="false" aria-label="Select" aria-keyshortcuts="3" title="Select (3)"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path stroke-width="2.4" stroke-dasharray="0 4" d="M4 4h16v16H4z" /></svg></button><button class="bb-tool" role="tab" aria-selected="false" aria-label="Erase" aria-keyshortcuts="E" title="Erase (E)"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20 4 15a1.6 1.6 0 0 1 0-2.3L12.7 4a1.6 1.6 0 0 1 2.3 0l5 5a1.6 1.6 0 0 1 0 2.3L11.4 20z" /><path d="M8.3 8.4l7.3 7.3" /><path d="M14.5 20h5.5" /></svg></button><button class="bb-tool" role="tab" aria-selected="false" aria-label="Hand" aria-keyshortcuts="H" title="Hand (H)"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12.5V6a1.5 1.5 0 0 1 3 0v5M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6a1.5 1.5 0 0 1 3 0v8.5a6 6 0 0 1-6 6h-.5a6 6 0 0 1-4.6-2.2L4 15.5a1.5 1.5 0 0 1 2.3-1.9L8 15" /></svg></button><button class="bb-tool" role="tab" aria-selected="false" aria-label="Frame" aria-keyshortcuts="F" title="Frame (F)"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 3.5v17M16.5 3.5v17M3.5 7.5h17M3.5 16.5h17" /></svg></button></div>
<button class="bb-link bb-tool-remove"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>Remove Frame</button>
<div class="bb-tool-actions"><button class="bb-link" disabled><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5h16M4 19.5h16" /><path d="M12 7.5v3.5M9.5 8.75 12 11.25l2.5-2.5" /><path d="M12 16.5V13M9.5 15.25 12 12.75l2.5 2.5" /></svg>Remove line</button><button class="bb-link bb-link--danger"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5h15" /><path d="M9.5 6.5v-2a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2" /><path d="M6.5 6.5l.8 12.2a1.6 1.6 0 0 0 1.6 1.5h6.2a1.6 1.6 0 0 0 1.6-1.5l.8-12.2" /></svg>Clear</button></div></div>
<div class="bb-group"><span class="bb-label">colors</span><div class="bb-swatches"><button class="bb-swatch" style="background:#b3382b" aria-pressed="true"></button><button class="bb-swatch" style="background:#f3efe6" aria-pressed="false"></button><button class="bb-swatch" style="background:#1f1f1f" aria-pressed="false"></button><button class="bb-swatch" style="background:#f0963c" aria-pressed="false"></button><button class="bb-swatch" style="background:#f2c94c" aria-pressed="false"></button><button class="bb-swatch" style="background:#27ae60" aria-pressed="false"></button><button class="bb-swatch" style="background:#2f6fe0" aria-pressed="false"></button><button class="bb-swatch" style="background:#9aa0a6" aria-pressed="false"></button></div></div>
<div class="bb-group"><span class="bb-label">edit</span><div class="bb-edit">
<button class="bb-btn bb-btn--toolbox" aria-label="Undo"><svg class="bb-icon bb-icon--17" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4.5 4 9l4.5 4.5" /><path d="M4 9h10a5.5 5.5 0 0 1 0 11h-3" /></svg></button><button class="bb-btn bb-btn--toolbox" aria-label="Redo"><svg class="bb-icon bb-icon--17" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4.5 20 9l-4.5 4.5" /><path d="M20 9H10a5.5 5.5 0 0 0 0 11h3" /></svg></button><button class="bb-btn bb-btn--toolbox" aria-label="Rotate"><svg class="bb-icon bb-icon--17" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="9.5" width="11" height="11" rx="2.5" /><path d="M11.5 4a8 8 0 0 1 8.5 7.5" /><path d="M17.8 9.6 20 11.8l2-2.4" /></svg></button><button class="bb-btn bb-btn--toolbox" aria-label="Copy"><svg class="bb-icon bb-icon--17" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5" /><path d="M15.5 8.5V6A2.5 2.5 0 0 0 13 3.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5" /></svg></button></div></div>
<div><div class="bb-disclosure bb-disclosure--split"><button class="bb-disclosure-main" aria-expanded="false"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 3.5v17M16.5 3.5v17M3.5 7.5h17M3.5 16.5h17" /></svg>Frame</button><button class="bb-frame-num" aria-label="Frame 1, bring it into view">1</button><span class="bb-meta">3.4 × 3.0 cm</span><svg class="bb-icon bb-icon--16 bb-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6" /></svg></div></div>
</div></div>
</body>
</html>
