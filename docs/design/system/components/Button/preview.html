<!-- @dsCard group="Actions" height=180 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button preview</title></head>
<body>
<div class="bb-col" style="padding:16px">
<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
  <button class="bb-btn bb-btn--primary"><svg class="bb-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>New Pattern</button>
  <button class="bb-btn bb-btn--primary is-pressed"><svg class="bb-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>Hover</button>
  <button class="bb-btn bb-btn--primary" disabled><svg class="bb-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5l5 5 10-10.5" /></svg>Row done</button>
  <span class="bb-select-wrap"><button class="bb-btn bb-btn--primary bb-select">Replace bead</button><svg class="bb-icon bb-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6" /></svg></span>
</div>
<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
  <button class="bb-btn">EN<span style="color:var(--subtle);margin-left:4px">/ RU</span></button>
  <button class="bb-btn bb-btn--text"><svg class="bb-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v11" /><path d="M7.5 10 12 14.5l4.5-4.5" /><path d="M4 15.5v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" /></svg>Import a file</button>
  <button class="bb-btn bb-btn--icon" aria-label="Turn row direction"><svg class="bb-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M8 19.5v-15M4.5 8 8 4.5 11.5 8" /><path d="M16 4.5v15M12.5 16l3.5 3.5 3.5-3.5" /></svg></button>
  <button class="bb-btn bb-btn--round" aria-label="Keyboard shortcuts"><svg class="bb-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5" /><path d="M8.5 14.5h7" /><path stroke-width="2.6" d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01" /></svg></button>
  <button class="bb-expand" aria-label="Expand"><svg class="bb-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v15" /><path d="M6 13.5l6 6 6-6" /></svg></button>
</div>
<div class="bb-stage--panel" style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:12px;border-radius:12px">
  <button class="bb-btn bb-btn--in-box"><svg class="bb-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14.5v-11" /><path d="M7.5 8 12 3.5 16.5 8" /><path d="M4 15.5v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" /></svg>Export<svg class="bb-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6" /></svg></button>
  <button class="bb-link"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5h16M4 19.5h16" /><path d="M12 7.5v3.5M9.5 8.75 12 11.25l2.5-2.5" /><path d="M12 16.5V13M9.5 15.25 12 12.75l2.5 2.5" /></svg>Remove line</button>
  <button class="bb-link bb-link--danger"><svg class="bb-icon bb-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5h15" /><path d="M9.5 6.5v-2a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2" /><path d="M6.5 6.5l.8 12.2a1.6 1.6 0 0 0 1.6 1.5h6.2a1.6 1.6 0 0 0 1.6-1.5l.8-12.2" /></svg>Delete all</button>
</div></div>
</body>
</html>
