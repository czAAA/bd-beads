<!-- @dsCard group="Canvas" height=560 width=960 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Rulers preview</title><style>
.rl-wrap{padding:16px;display:grid;gap:14px;color:var(--ink);font-family:var(--font-sans)}
.rl-ctl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center;background:var(--panel);border-radius:12px;padding:14px 18px}
.rl-ctl label,.rl-lab{font:400 12px/16px var(--font-mono);color:var(--muted);text-transform:lowercase}
.rl-ctl input[type=range]{width:100%;max-width:340px;accent-color:var(--accent-strong)}
.rl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rl-sw{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 6px;border:1px solid var(--line-strong);border-radius:8px;background:var(--elevated);color:var(--ink);font:500 12px/1 var(--font-sans);cursor:pointer}
.rl-sw i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--field-line);box-sizing:border-box}
.rl-sw[aria-pressed=true]{outline:2px solid var(--ring);outline-offset:1px}
.rl-sw:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.rl-chk{display:inline-flex;gap:6px;align-items:center;font:500 13px/18px var(--font-sans);color:var(--body)}
.rl-var{background:var(--panel);border-radius:12px;padding:14px 18px 16px;display:grid;gap:10px}
.rl-var h4{margin:0;font:600 14px/20px var(--font-sans)}
.rl-var p{margin:0;color:var(--body);font:400 13px/19px var(--font-sans)}
.rl-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rl-th{border-radius:10px;overflow:hidden;background:var(--canvas);color:var(--ink);min-width:0}
.rl-th .rl-lab{padding:6px 10px 4px;display:flex;justify-content:space-between;gap:8px}
.rl-st{font:500 12px/16px var(--font-sans);text-transform:none;color:var(--body)}
.rl-st.bad{color:var(--danger)}
.rl-pan{position:relative;height:156px;overflow:hidden;padding:0 !important}
.rl-g{position:absolute;background:var(--canvas-bg,var(--canvas-bg-1));z-index:2;font-family:var(--font-mono);line-height:1;white-space:nowrap}
.rl-l{position:absolute;color:var(--ruler);font-weight:400;display:flex;align-items:center;justify-content:center}
.rl-l.em{color:var(--body);font-weight:700}
.rl-l.cur{color:var(--marker);font-weight:700}
.rl-t{position:absolute;background:var(--ruler)}
.rl-t.em{background:var(--body)}
.rl-beads{position:absolute;z-index:1}
.rl-beads .bb-bead{position:absolute}
.rl-cur{position:absolute;z-index:3;border:2px solid var(--marker);border-radius:5px;pointer-events:none}
.rl-foot{margin:0;color:var(--body);font:400 13px/19px var(--font-sans)}
</style></head>
<body>
<div class="rl-wrap">
  <div class="rl-ctl">
    <label for="rl-size">bead size</label>
    <div class="rl-row"><input id="rl-size" type="range" min="4" max="30" value="16"><b id="rl-size-out" class="rl-lab" style="color:var(--ink)">16px · pitch 18px</b></div>
    <label>columns</label>
    <div class="rl-row"><button class="rl-sw" data-start="1" aria-pressed="false">1 to 99</button><button class="rl-sw" data-start="90" aria-pressed="true">90 to 999 (turns at 100)</button><span class="rl-chk"><input type="checkbox" id="rl-phone"><label for="rl-phone" style="font:inherit;color:inherit;text-transform:none">Phone: 12px numbers</label></span></div>
    <label>light canvas</label><div class="rl-row" id="rl-bgL"></div>
    <label>dark canvas</label><div class="rl-row" id="rl-bgD"></div>
  </div>
  <div id="rl-vars" style="display:grid;gap:14px"></div>
  <p class="rl-foot">Every number is drawn, 1 upwards. Drag the bead size down to find where the numbers start to touch. The status line measures the real text. With the Rulers toggle off a piece's rectangle is not drawn either; the Frame's line stays.</p>
</div>
<script>
(function(){
var VARS=[
 {id:'A',name:'Approved · variant A, column numbers turned from 100',text:'Every number is drawn. Every 5th is bold in body color, the rest regular in ruler color. Column numbers up to 99 are horizontal; from 100 they are turned a quarter turn and read upward, so three digits take no more width than two. Row numbers stay horizontal.',turnFrom:100}
];
var LB=[['Studio','#fafafa'],['Linen','#f7f3ec'],['Sage','#f1f5ee'],['Mist','#eff4f8'],['Blush','#fbf0ea']];
var DB=[['Night','#1a1a1a'],['Ink','#0e0e0e'],['Midnight','#12161c'],['Olive','#171608'],['Umber','#1c1714'],['Ash','#2c2b29']];
var S={bead:16,start:90,bgL:5,bgD:6,phone:false};
var COL=['#b3382b','#f2c94c','#1a1a1a','#f3efe6','#2d6a9f'];
function sw(list,key,host){var h=document.getElementById(host);list.forEach(function(c,i){var b=document.createElement('button');b.className='rl-sw';b.innerHTML='<i style="background:'+c[1]+'"></i>'+c[0];b.setAttribute('aria-pressed',String(i+1===S[key]));b.onclick=function(){S[key]=i+1;[].forEach.call(h.children,function(x,j){x.setAttribute('aria-pressed',String(j===i))});render()};h.appendChild(b)})}
sw(LB,'bgL','rl-bgL');sw(DB,'bgD','rl-bgD');
[].forEach.call(document.querySelectorAll('[data-start]'),function(b){b.onclick=function(){S.start=+b.dataset.start;[].forEach.call(document.querySelectorAll('[data-start]'),function(x){x.setAttribute('aria-pressed',String(x===b))});render()}});
document.getElementById('rl-size').oninput=function(e){S.bead=+e.target.value;render()};
document.getElementById('rl-phone').onchange=function(e){S.phone=e.target.checked;render()};
var host=document.getElementById('rl-vars');
VARS.forEach(function(v){var d=document.createElement('div');d.className='rl-var';d.innerHTML='<h4>'+v.name+'</h4><p>'+v.text+'</p><div class="rl-pair"></div>';host.appendChild(d);v.el=d.querySelector('.rl-pair')});
function panel(v,theme,bg){
  var fs=S.phone?12:11, fsE=fs, bead=S.bead, p=bead+2;
  var leftW=32, tick=0, emBoost=0;
  var th=document.createElement('div');th.className='rl-th';th.setAttribute('data-theme',theme);th.style.colorScheme=theme;
  th.innerHTML='<div class="rl-lab"><span>'+theme+' · '+(theme==='light'?LB:DB)[bg-1][0]+'</span><span class="rl-st"></span></div>';
  var wrap=document.createElement('div');wrap.setAttribute('data-canvas-bg',bg);
  var pan=document.createElement('div');pan.className='bb-board-wrap rl-pan';wrap.appendChild(pan);th.appendChild(wrap);
  v.el.appendChild(th);
  var W=pan.clientWidth,H=pan.clientHeight;
  var cols=Math.max(1,Math.floor((W-leftW-tick-10)/p)),tall=S.start+cols-1>=v.turnFrom,topH=tall?28:20,rows=Math.max(1,Math.floor((H-topH-tick-6)/p));
  var x0=leftW+tick,y0=topH+tick;
  var beads=document.createElement('div');beads.className='rl-beads';beads.style.cssText='left:'+x0+'px;top:'+y0+'px;width:'+(cols*p)+'px;height:'+(rows*p)+'px';
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){var b=document.createElement('span');b.className='bb-bead';b.style.cssText='width:'+bead+'px;height:'+bead+'px;left:'+(c*p)+'px;top:'+(r*p)+'px;background:'+COL[(r*3+c*2+((r>>1)&1))%5];beads.appendChild(b)}
  pan.appendChild(beads);
  var cur=Math.min(3,rows);var o=document.createElement('div');o.className='rl-cur';o.style.cssText='left:'+(x0-3)+'px;top:'+(y0+(cur-1)*p-3)+'px;width:'+(cols*p+4)+'px;height:'+(p+2)+'px';pan.appendChild(o);
  var gt=document.createElement('div');gt.className='rl-g';gt.style.cssText='left:'+x0+'px;top:0;width:'+(cols*p)+'px;height:'+(y0)+'px';
  var gl=document.createElement('div');gl.className='rl-g';gl.style.cssText='left:0;top:'+y0+'px;width:'+x0+'px;height:'+(rows*p)+'px';
  var tops=[],lefts=[];
  for(var c=0;c<cols;c++){var n=S.start+c,em=n%5===0;
    var l=document.createElement('span');l.className='rl-l'+(em?' em':'');l.style.fontSize=(em?fsE:fs)+'px';l.textContent=n;
    if(n>=v.turnFrom){l.style.cssText+=';left:'+(c*p)+'px;width:'+bead+'px;top:0;height:'+topH+'px;padding-bottom:'+(tick+3)+'px;box-sizing:border-box;align-items:center;writing-mode:vertical-rl;transform:rotate(180deg)'}
    else{l.style.cssText+=';left:'+(c*p)+'px;width:'+bead+'px;bottom:'+(tick+3)+'px;height:'+(em?fsE:fs)+'px'}
    gt.appendChild(l);tops.push(l);
    if(false){var t=document.createElement('i');t.className='rl-t'+(em?' em':'');t.style.cssText='left:'+(c*p+Math.floor(p/2))+'px;bottom:0;width:1px;height:'+(em?7:3)+'px';gt.appendChild(t)}}
  for(var r=0;r<rows;r++){var m=r+1,em=m%5===0,isc=m===cur;
    var l2=document.createElement('span');l2.className='rl-l'+(isc?' cur':(em?' em':''));l2.style.fontSize=(em&&!isc?fsE:fs)+'px';l2.textContent=m;
    l2.style.cssText+=';top:'+(r*p)+'px;height:'+bead+'px;right:'+(tick+5)+'px;left:auto;justify-content:flex-end';
    gl.appendChild(l2);lefts.push(l2);
    if(false){var t2=document.createElement('i');t2.className='rl-t'+(em?' em':'');t2.style.cssText='right:0;top:'+(r*p+Math.floor(p/2))+'px;height:1px;width:'+(em?7:3)+'px';gl.appendChild(t2)}}
  pan.appendChild(gt);pan.appendChild(gl);
  var bad=0,maxW=0,maxH=0;
  for(var i=0;i<tops.length;i++){var a=tops[i].firstChild?null:null;}
  function ext(el){var rg=document.createRange();rg.selectNodeContents(el);return rg.getBoundingClientRect()}
  var er=tops.map(ext);
  for(var i=0;i<er.length-1;i++){if(er[i].right+2>er[i+1].left)bad++}
  er.forEach(function(r){maxW=Math.max(maxW,v.turn?r.width:r.width)});
  var el=lefts.map(ext);
  for(var j=0;j<el.length-1;j++){if(el[j].bottom+1>el[j+1].top)bad++}
  el.forEach(function(r){maxH=Math.max(maxH,r.height)});
  var needTop=Math.ceil(maxW+3)-2, needLeft=Math.ceil(maxH+1)-2, need=Math.max(needTop,needLeft,4);
  var st=th.querySelector('.rl-st');
  st.className='rl-st'+(bad?' bad':'');
  st.textContent=bad?('numbers touch · needs bead ≥ '+need+'px'):('every number clear · min bead '+need+'px');
  pan.setAttribute('role','img');pan.setAttribute('aria-label','Ruler variant '+v.id+' in '+theme);
}
function render(){
  document.getElementById('rl-size-out').textContent=S.bead+'px · pitch '+(S.bead+2)+'px';
  VARS.forEach(function(v){v.el.innerHTML='';panel(v,'light',S.bgL);panel(v,'dark',S.bgD)});
}
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
window.addEventListener('resize',render);
})();
</script>
</body>
</html>
